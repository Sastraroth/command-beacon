<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Command Beacon — rules engine v17</title>
<style>
:root{--bg:#050a0f;--panel:#0b141c;--line:#294050;--text:#eaf2f6;--muted:#8ea5b4;--gold:#d9b65b;--green:#65d39a;--red:#e26d6d;--blue:#5eb6e6}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:radial-gradient(circle at 50% 45%,#122532,#071017 60%,#03070b);color:var(--text);font:13px Inter,system-ui,Arial,sans-serif}button{background:#142633;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 9px;cursor:pointer}button:hover{background:#1b3444;border-color:#547286}button:disabled{opacity:.35;cursor:not-allowed}.top{height:52px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#08121a}.brand{font-weight:900;letter-spacing:.8px}.pill{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 8px}.layout{height:calc(100vh - 52px);padding:7px;display:grid;grid-template-columns:245px 1fr 245px;grid-template-rows:1fr 178px;gap:7px}.board{grid-column:1/4;position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;overflow:hidden;border:1px solid var(--line);border-radius:11px;background:#061016}.seat{position:relative;padding:7px;border:1px solid #203541;min-width:0;min-height:0;background:linear-gradient(145deg,#0c1821,#081219)}.seat.active{box-shadow:inset 0 0 0 2px #d9b65b88}.seat.commander-bg{background-image:linear-gradient(180deg,rgba(5,10,15,.52),rgba(5,10,15,.84)),var(--cmd-bg);background-size:cover;background-position:center}.seat.commander-bg.you{background-image:linear-gradient(180deg,rgba(5,10,15,.42),rgba(5,10,15,.80)),var(--cmd-bg)}.seat.you{background:linear-gradient(145deg,#10202a,#09151c)}.head{height:40px;position:relative;z-index:3;display:flex;justify-content:space-between;gap:8px}.name{font-weight:900}.meta{color:var(--muted);font-size:9px;margin-top:2px}.life{font-size:20px;font-weight:900}.counters{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.counter{font-size:8px;border:1px solid #304858;background:#0a151d;border-radius:999px;padding:2px 5px}.zones{position:absolute;right:6px;top:6px;display:flex;gap:4px;z-index:4;flex-wrap:wrap;justify-content:flex-end;max-width:55%}.zone{font-size:9px;color:#c4d4dc;border:1px solid #355363;border-radius:5px;padding:4px 6px;background:#071119cc}.battle{height:calc(100% - 112px);position:relative;display:flex;align-items:center;justify-content:center;.battlefield{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:5px;max-width:90%;max-height:88%;overflow:hidden}.card{width:56px;height:78px;border-radius:6px;object-fit:cover;background:#152530;border:1px solid #526b79;box-shadow:0 3px 8px #0009;transition:.12s}.you .card{width:61px;height:85px}.opponent .card{width:45px;height:63px}.card:hover{transform:translateY(-5px) scale(1.05);z-index:5}.tapped{transform:rotate(90deg);margin:0 11px}.attackable{outline:2px solid var(--green);cursor:pointer}.required{outline:3px solid var(--red);cursor:pointer}.selected{outline:3px solid var(--gold);transform:translateY(-6px)}.empty{color:#607886;font-size:10px}.center{display:none;position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,31%);min-width:220px;background:#08131bf2;border:1px solid #466173;border-radius:10px;padding:8px;box-shadow:0 15px 45px #000c}.center h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 5px}.stackitem{padding:5px;border:1px solid #304756;background:#101d26;border-radius:5px;font-size:10px;margin:3px 0}.side,.bottom{background:#0b151d;border:1px solid var(--line);border-radius:9px;padding:8px}.side{grid-column:1;grid-row:2;overflow:auto}.bottom{grid-column:2/4;grid-row:2;display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}.hand{grid-column:1/3;display:none;align-items:end;justify-content:center;gap:5px;min-height:93px;overflow:hidden}.seat-hand{position:absolute;left:7px;right:7px;bottom:5px;transform:none;display:flex;align-items:flex-end;justify-content:center;gap:4px;max-width:none;overflow:hidden;z-index:6;border-top:1px solid #294050;padding-top:5px}.seat-hand:before{content:"HAND";position:absolute;left:2px;top:-8px;font-size:7px;color:#78919f;letter-spacing:.8px}.seat-hand .card{width:40px;height:56px}.you .seat-hand .card{width:48px;height:67px}.seat-hand .card.legal{outline:2px solid var(--green);cursor:pointer}.zone{cursor:pointer}.zone:hover{border-color:#6c91a5;background:#10202b}.mana-btn{font-size:8px;padding:3px 5px;margin:2px}.zone-modal{position:fixed;z-index:500;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,90vw);max-height:78vh;overflow:auto;background:#08131bf7;border:1px solid #466173;border-radius:11px;padding:14px;box-shadow:0 20px 80px #000e}.zone-grid{display:flex;flex-wrap:wrap;gap:7px}.zone-grid .card{width:70px;height:98px}.zone-modal h2{margin:0 0 8px}.zone-close{float:right}.zone-note{font-size:10px;color:var(--muted);margin-bottom:10px}.controls{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.priority{margin-left:auto;color:var(--gold);font-weight:800}.stack-dock{display:none;position:absolute;right:8px;bottom:8px;max-width:360px;max-height:120px;overflow:auto;background:#08131bf2;border:1px solid #466173;border-radius:8px;padding:7px;z-index:30}.stack-dock.show{display:block}.stack-dock .stack-title{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}.stack-dock .stackitem{margin:2px 0;padding:4px;font-size:9px}.log{height:130px;overflow:auto;font-size:10px;color:#b7c7d0}.log div{padding:3px 0;border-bottom:1px solid #162630}.reaction{position:absolute;z-index:100;left:50%;top:50%;transform:translate(-50%,-50%);width:min(700px,78%);background:#07121bf5;border:1px solid #577185;border-radius:11px;padding:14px;box-shadow:0 20px 70px #000d} .setup-overlay{position:fixed;inset:0;z-index:1000;background:rgba(2,6,10,.9);display:flex;align-items:center;justify-content:center;padding:20px}.setup-panel{width:min(920px,94vw);max-height:90vh;overflow:auto;background:#09131b;border:1px solid #466173;border-radius:14px;box-shadow:0 25px 100px #000f;padding:22px}.setup-panel h1{margin:0 0 5px;font-size:22px}.setup-panel .sub{margin-bottom:18px}.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.setup-card{background:#0d1b24;border:1px solid #294050;border-radius:10px;padding:14px}.setup-card h3{margin:0 0 8px}.setup-card input,.setup-card textarea{width:100%;padding:9px;background:#071119;color:var(--text);border:1px solid #294050;border-radius:6px}.setup-card textarea{height:110px;resize:vertical}.setup-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.setup-hand{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0 18px}.setup-hand .card{width:105px;height:147px}.setup-hand .card:hover{transform:translateY(-4px) scale(1.03)}.setup-status{font-size:11px;color:var(--muted);min-height:18px}.setup-error{color:var(--red)}.setup-ok{color:var(--green)}.setup-choice{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px}.setup-choice button{min-width:120px}.setup-titlebar{display:flex;justify-content:space-between;align-items:center;gap:10px}.setup-badge{font-size:10px;color:var(--gold);border:1px solid #67582d;border-radius:999px;padding:4px 8px}@media(max-width:800px){.setup-grid{grid-template-columns:1fr}.setup-hand .card{width:75px;height:105px}}.reaction h2{margin:0 0 4px}.sub{font-size:11px;color:var(--muted);margin-bottom:8px}.actions{display:flex;gap:6px;flex-wrap:wrap}.legal{color:var(--green)}.illegal{color:var(--muted)}.timer{font-size:12px;font-weight:900;color:#eaf2f6}.timer.warn{color:#e26d6d}.seat.emptySeat{opacity:.55;background:linear-gradient(145deg,#091118,#050b10)}.seat.emptySeat .battle{align-items:center}.seatToggle{margin:2px;font-size:9px}.turnbar{display:flex;gap:8px;align-items:center}.loading{position:fixed;right:10px;bottom:8px;padding:5px 8px;border:1px solid var(--line);background:#07121ddd;border-radius:6px;font-size:10px;z-index:200}
</style></head><body>
<header class="top"><div class="brand">COMMAND BEACON <span class="pill">rules engine v17</span></div><div class="turnbar"><span id="turn" class="pill">Waiting</span> <span id="step" class="pill">—</span> <span id="timer" class="pill timer">45.0s</span></div></header>
<div class="layout"><main class="board" id="board"><section class="seat" id="seat3"></section><section class="seat" id="seat2"></section><section class="seat you" id="seat1"></section><section class="seat" id="seat4"></section><div id="reaction"></div></main>
<aside class="side"><b>Deck / Rules</b><div style="margin:8px 0"><button onclick="importDeck()">Import sample deck</button><button onclick="shuffleLibrary()">Shuffle</button></div><div style="margin:8px 0"><input id="moxUrl" placeholder="Paste Moxfield deck URL" style="width:100%;padding:7px;background:#08131b;color:#eaf2f6;border:1px solid #294050;border-radius:6px"><button onclick="importMoxfield()" style="margin-top:5px;width:100%">Import from Moxfield URL</button><textarea id="deckText" placeholder="Fallback: paste a Moxfield exported decklist here" style="width:100%;height:70px;margin-top:6px;padding:7px;background:#08131b;color:#eaf2f6;border:1px solid #294050;border-radius:6px;resize:vertical"></textarea><button onclick="importDeckText()" style="margin-top:5px;width:100%">Import decklist text</button><div class="small" style="margin-top:4px">Public Moxfield URLs are supported. Text export is a fallback if the browser blocks the Moxfield request.</div></div><div><b>Seats</b><div id="seatsCtl"></div></div><div id="legalInfo" class="small"></div><hr style="border-color:#1b2b35"><b>Game log</b><div id="log" class="log"></div></aside>
<section class="bottom"><div class="controls"><button onclick="passPriority()">Pass Priority</button><button onclick="advanceStep()">Next Step</button><button onclick="passTurn()">Pass Turn</button><span id="priority" class="priority">Priority: —</span></div><div class="small" id="phaseHint"></div><div id="phaseActions" class="controls"></div><div class="hand" id="hand"></div><div id="stackDock" class="stack-dock"><div class="stack-title">Stack</div><div id="stack"></div></div></section></div>
<div id="setupModal"></div><div id="loading" class="loading" style="display:none"></div><div id="zoneModal"></div>
<script>
const sample=["Sol Ring","Command Tower","Arcane Signet","Counterspell","Lightning Bolt","Force of Will","Island","Mountain","Plains","Forest","Swamp","Swords to Plowshares","Brainstorm","Cultivate","Llanowar Elves"];
const cache={};
const phases=["Untap","Upkeep","Draw","Main 1","Beginning of Combat","Declare Attackers","Declare Blockers","Combat Damage","End of Combat","Main 2","End Step","Cleanup"];
const COLORS=['W','U','B','R','G','C'];
const state={players:[],active:1,phaseIndex:0,stack:[],priority:1,log:[],turn:1,reaction:null,openingMulligan:true,mulligans:0,gameStarted:false,setupStage:'deck',deckTitle:'',timer:{remaining:45,lastAction:0,maxTurn:300,turnElapsed:0,interval:null}};
function newPlayer(id){return{id,name:`Player ${id}`,seated:true,life:40,hand:[],library:[],battlefield:[],graveyard:[],exile:[],commandZone:[],mana:{W:0,U:0,B:0,R:0,G:0,C:0},landPlays:1,landPlayed:0,landPlayBonus:0,poison:0,experience:0,energy:0,rad:0,monarch:false,initiative:false,cityBlessing:false,commanderDamage:{},commanderCasts:{},attackers:[],blockers:{},blockConfirmed:false,attackTargets:{},damageMarked:0}}
state.players=[1,2,3,4].map(newPlayer);
function seatedPlayers(){return state.players.filter(x=>x.seated)}
function nextSeated(fromId){const ids=seatedPlayers().map(x=>x.id);if(!ids.length)return fromId;const i=ids.indexOf(fromId);return ids[(i+1+ids.length)%ids.length]}
function hasSeat(id){return !!state.players[id-1]?.seated}
function setSeat(id,on){if(id===1)return;const pl=state.players[id-1];pl.seated=on;if(!on){pl.attackers=[];pl.blockers={};if(state.active===id){state.active=nextSeated(id);state.priority=state.active;resetTurnTimer()}}log(`${pl.name} ${on?'joined':'left'} the table.`);render()}
function p(id=state.active){return state.players[id-1]}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function log(s){state.log.unshift(s);document.querySelector('#log').innerHTML=state.log.slice(0,30).map(x=>`<div>${esc(x)}</div>`).join('')}
function back(){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280"><rect width="100%" height="100%" rx="14" fill="#162b3a"/><rect x="12" y="12" width="176" height="256" rx="10" fill="#0b151e" stroke="#486274"/><circle cx="100" cy="140" r="48" fill="#1e4b68" stroke="#6b8da0"/><text x="100" y="147" text-anchor="middle" fill="#d9b65b" font-family="Arial" font-size="28" font-weight="700">CB</text></svg>`)}
async function card(name){
 if(cache[name])return cache[name];
 const fail={name,type:'',oracle:'',img:'',colors:[],cmc:0,manaCost:'',power:null,toughness:null,subtypes:[],isLand:false,isCreature:false,isInstant:false,isSorcery:false,hasHaste:false,keywords:[],isCommander:false};
 try{
  const r=await fetch('https://api.scryfall.com/cards/named?exact='+encodeURIComponent(name),{headers:{'Accept':'application/json'}});
  if(!r.ok)throw new Error('Scryfall '+r.status);
  const d=await r.json();
  const face=d.card_faces?.[0];
  const img=d.image_uris?.normal||face?.image_uris?.normal||'';
  const obj={name:d.name,type:d.type_line||'',oracle:d.oracle_text||face?.oracle_text||'',img,colors:d.colors||face?.colors||[],cmc:d.cmc||0,manaCost:d.mana_cost||face?.mana_cost||'',power:d.power==null?(face?.power==null?null:+face.power):+d.power,toughness:d.toughness==null?(face?.toughness==null?null:+face.toughness):+d.toughness,subtypes:d.subtypes||face?.subtypes||[],isLand:/^Land\b/i.test(d.type_line||''),isCreature:/\bCreature\b/i.test(d.type_line||''),isInstant:/\bInstant\b/i.test(d.type_line||''),isSorcery:/\bSorcery\b/i.test(d.type_line||''),hasHaste:/\bhaste\b/i.test((d.oracle_text||face?.oracle_text||''))||/\bhaste\b/i.test(d.keywords?.join(' ')||''),keywords:d.keywords||[],isCommander:false};
  return cache[name]=obj;
 }catch(e){cache[name]=fail;return fail}
}
function manaAbility(c){const o=c.oracle||'';return /(^|\n).*:\s*.*\badd\b.*(?:mana|\{[WUBRGC]\})/i.test(o)||/\badd\s+(?:\{[WUBRGC]\}|one|two|three|four|five|six|seven|eight|nine|ten)\s+mana\b/i.test(o)}
function hasFlash(c){return c.keywords?.some(k=>k.toLowerCase()==='flash')||/\bflash\b/i.test(c.oracle||'')}
function emptyMana(){return {W:0,U:0,B:0,R:0,G:0,C:0}}
function parseManaCost(cost){const out={W:0,U:0,B:0,R:0,G:0,C:0,generic:0};for(const t of (cost||'').match(/\{[^}]+\}/g)||[]){const x=t.slice(1,-1);if(/^\d+$/.test(x))out.generic+=+x;else if(x in out)out[x]++;else if(x.includes('/')){out.generic++;}else if(/^X$/i.test(x)){}else out.generic++}return out}
function totalMana(m){return COLORS.reduce((a,c)=>a+(m[c]||0),0)}
function canPay(pl,cost){const need=parseManaCost(cost);let pool={...pl.mana};for(const c of COLORS){const n=need[c]||0;if((pool[c]||0)<n)return false;pool[c]-=n}let generic=need.generic||0;for(const c of COLORS){const take=Math.min(pool[c]||0,generic);generic-=take;pool[c]-=take}return generic===0}
function payMana(pl,cost){const need=parseManaCost(cost);for(const c of COLORS){pl.mana[c]-=need[c]||0}let generic=need.generic||0;for(const c of COLORS){const take=Math.min(pl.mana[c],generic);pl.mana[c]-=take;generic-=take}return generic===0}
function manaText(m){return COLORS.filter(c=>m[c]).map(c=>`${c}:${m[c]}`).join(' ')||'—'}
function canLand(pl){return isMain()&&pl.landPlayed<pl.landPlays}
function isMain(){return state.phaseIndex===3||state.phaseIndex===9}
function canCast(pl,c){if(c.isLand||!pl.hand.includes(c))return false;if(!canPay(pl,c.manaCost))return false;if(isMain())return true;return c.isInstant||hasFlash(c)}
function legalCards(pl){return pl.hand.filter(c=>c.isLand?canLand(pl):canCast(pl,c))}
function cardImg(c){return c.img||back()}
function phaseHint(){const pl=p();if(!pl)return '';if(state.phaseIndex===0)return 'Untap: permanents untap unless an effect says otherwise.';if(state.phaseIndex===1)return 'Upkeep: upkeep triggers are checked before you draw.';if(state.phaseIndex===2)return state.turn===1&&pl.id===1?'First turn: no draw for the starting player.':'Draw step: draw one card.';if(state.phaseIndex===3||state.phaseIndex===9)return 'Main phase: play a land if you have a land play; cast spells you can legally cast.';if(state.phaseIndex===4)return 'Beginning of combat: combat-start triggers may go on the stack.';if(state.phaseIndex===5)return 'Declare attackers: green is legal; red means the creature must attack.';if(state.phaseIndex===6)return 'Declare blockers: choose legal blockers, then confirm.';if(state.phaseIndex===7)return 'First-strike damage.';if(state.phaseIndex===8)return 'Combat damage.';if(state.phaseIndex===10)return 'End step: end-step triggers and priority.';return 'Cleanup: damage wears off and cleanup effects resolve.';}
function showSetupDeck(){
 state.gameStarted=false;state.setupStage='deck';state.openingMulligan=true;state.mulligans=0;
 const el=document.querySelector('#setupModal');if(!el)return;
 el.innerHTML=`<div class="setup-overlay"><div class="setup-panel"><div class="setup-titlebar"><div><h1>Choose your deck</h1><div class="sub">Load a Commander deck before the game starts. The game will not enter the battlefield until you keep your opening hand.</div></div><span class="setup-badge">COMMAND BEACON</span></div><div class="setup-grid"><div class="setup-card"><h3>Import from Moxfield</h3><div class="setup-status">Paste a public Moxfield deck URL.</div><input id="setupMoxUrl" placeholder="https://moxfield.com/decks/..." value=""><div class="setup-actions"><button onclick="setupImportMoxfield()">Import from Moxfield</button></div></div><div class="setup-card"><h3>Use a sample deck</h3><div class="setup-status">Use the built-in test deck to test the rules engine immediately.</div><div class="setup-actions"><button onclick="setupLoadSample()">Use sample Commander deck</button></div></div></div><div class="setup-card" style="margin-top:14px"><h3>Paste exported decklist</h3><textarea id="setupDeckText" placeholder="Paste a Moxfield exported decklist here if the browser blocks the Moxfield request."></textarea><div class="setup-actions"><button onclick="setupImportText()">Import decklist</button></div></div><div id="setupStatus" class="setup-status" style="margin-top:12px"></div></div></div>`;
}
function setupStatus(msg,ok=false){const el=document.querySelector('#setupStatus');if(el){el.className=`setup-status ${ok?'setup-ok':'setup-error'}`;el.textContent=msg}}
function setupLoadSample(){importDeck(true)}
async function setupImportMoxfield(){
 const input=document.querySelector('#setupMoxUrl')?.value||'',id=extractMoxfieldId(input);if(!id){setupStatus('Enter a valid public Moxfield deck URL.');return}
 setupStatus('Loading deck from Moxfield…',true);
 try{const deck=await fetchMoxfieldDeck(id);const lists=extractDeckNames(deck);if(!lists.main.length&&!lists.commanders.length)throw new Error('No commander/mainboard cards found.');await loadImportedDeck(lists,deck?.name||'Moxfield deck',true)}catch(e){setupStatus(`Moxfield import failed: ${e.message||e}`)}}
async function setupImportText(){
 const text=document.querySelector('#setupDeckText')?.value||'',lists=parseDeckText(text);if(!lists.main.length&&!lists.commanders.length){setupStatus('Could not read the decklist.');return}
 setupStatus('Loading decklist…',true);try{await loadImportedDeck(lists,'Imported decklist',true)}catch(e){setupStatus(`Deck import failed: ${e.message||e}`)}}
function showOpeningHand(){
 state.setupStage='mulligan';state.openingMulligan=true;
 const pl=p(1),el=document.querySelector('#setupModal');if(!el)return;
 const hand=pl.hand.map(c=>`<img class="card" src="${cardImg(c)}" title="${esc(c.name)}" onerror="this.onerror=null;this.src=back()">`).join('');
 el.innerHTML=`<div class="setup-overlay"><div class="setup-panel"><div class="setup-titlebar"><div><h1>Opening hand</h1><div class="sub">${esc(state.deckTitle||'Commander deck')} • ${pl.hand.length} cards</div></div><span class="setup-badge">MULLIGAN ${state.mulligans}</span></div><div class="setup-hand">${hand||'<span class="empty">No cards</span>'}</div><div class="setup-choice"><button onclick="keepOpeningHand()">Keep hand</button><button onclick="mulliganOpeningHand()">Mulligan</button></div><div class="setup-status" style="text-align:center;margin-top:12px">First mulligan is free. The battlefield and turn sequence begin only after you keep.</div></div></div>`;
}
function keepOpeningHand(){
 const pl=p(1);state.openingMulligan=false;state.setupStage='game';state.gameStarted=true;state.active=1;state.priority=1;state.phaseIndex=0;state.turn=1;state.stack=[];resetTurnTimer();document.querySelector('#setupModal').innerHTML='';log(`${pl.name} kept the opening hand. Game starts.`);render();startStep()
}
function mulliganOpeningHand(){
 const pl=p(1);pl.library.push(...pl.hand);pl.hand=[];pl.library.sort(()=>Math.random()-.5);pl.hand=pl.library.splice(0,7);state.mulligans++;log(`${pl.name} took mulligan #${state.mulligans}.`);showOpeningHand()
}
function render(){
 renderSeatControls();state.players.forEach(renderSeat);

function resolveCombatDamage(firstStrike=false){
 const atk=p();
 for(const ai of atk.attackers){
  const a=atk.battlefield[ai]; if(!a) continue;
  const hasFS=a.keywords?.some(k=>/first strike/i.test(k))||/first strike/i.test(a.oracle||'');
  const hasDS=a.keywords?.some(k=>/double strike/i.test(k))||/double strike/i.test(a.oracle||'');
  if(firstStrike&&!hasFS&&!hasDS)continue;
  if(!firstStrike&&hasFS&&!hasDS)continue;
  const target=p(atk.attackTargets[ai]); if(!target)continue;
  const blocks=target.blockers[ai]||[];
  let remaining=Math.max(0,a.power||0);
  if(blocks.length){
   // Attacker assigns damage to blockers in the order the blockers were declared.
   for(const bi of blocks){
    const b=target.battlefield[bi]; if(!b)continue;
    const lethal=b.damageMarked>=((b.toughness||0))?0:(b.toughness||0)-(b.damageMarked||0);

   dealCombatToPlayer(a,target,remaining);

  for(const bi of blocks){
   const b=target.battlefield[bi];
   if(!b)continue;
   const blockerHasFS=b.keywords?.some(k=>/first strike/i.test(k))||/first strike/i.test(b.oracle||'');
   const blockerHasDS=b.keywords?.some(k=>/double strike/i.test(k))||/double strike/i.test(b.oracle||'');

function lose(pl,reason){if(!pl.seated)return;pl.seated=false;log(`${pl.name} loses the game (${reason}). Their seat is skipped.`);if(state.active===pl.id){state.active=nextSeated(pl.id);state.priority=state.active}}

function openReaction(reason){state.reaction=reason;document.querySelector('#reaction').innerHTML=`<div class="reaction"><h2>Priority / Reaction</h2><div class="sub">${esc(reason)}</div><div class="small">Players receive priority in turn order. Auto-pass never checks mana alone; it checks whether a legal interaction exists.</div><div class="actions" style="margin-top:10px"><button onclick="passPriority()">Pass Priority</button><button onclick="resolveTop()">Resolve top object</button><button onclick="closeReaction()">Close</button></div></div>`}
function closeReaction(){document.querySelector('#reaction').innerHTML='';state.reaction=null;render()}
function extractMoxfieldId(input){
 try{
  const u=new URL(input.trim());
  const m=u.pathname.match(/\/decks\/([A-Za-z0-9_-]+)/i);
  return m?m[1]:null;
 }catch(e){return input.trim().match(/^[A-Za-z0-9_-]{8,}$/)?.[0]||null}
}
function boardEntries(board){
 if(!board)return [];
 const cards=board.cards??board;
 if(Array.isArray(cards))return cards;
 if(cards&&typeof cards==='object')return Object.entries(cards).map(([key,value])=>{
  if(value&&typeof value==='object')return {...value, name:value.name||value.card?.name||key};
  return {name:key,quantity:Number(value)||1};
 });
 return [];
}
function moxCardName(entry){return entry?.card?.name||entry?.name||entry?.cardName||entry?.details?.name||entry?.card?.oracleId?.name||'';}
function moxQty(entry){
 const n=Number(entry?.quantity??entry?.qty??entry?.count??1);return Number.isFinite(n)&&n>0?Math.floor(n):1;
}
async function fetchMoxfieldDeck(id){
 const direct=[
  `https://api2.moxfield.com/v3/decks/all/${encodeURIComponent(id)}`,
  `https://api2.moxfield.com/v2/decks/all/${encodeURIComponent(id)}`,
  `https://api.moxfield.com/v2/decks/all/${encodeURIComponent(id)}`
 ];
 const urls=[...direct,...direct.map(u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`)];
 let last='';
 for(const url of urls){
  try{
   const r=await fetch(url,{headers:{'Accept':'application/json,text/plain,*/*','Cache-Control':'no-cache'}});
   if(!r.ok){last=`Moxfield ${r.status}`;continue}
   const text=await r.text();
   const d=JSON.parse(text);
   if(d?.boards||d?.mainboard||d?.commanders||d?.publicId)return d;
   last='Moxfield returned no deck boards';
  }catch(e){last=e?.message||'Network/CORS error'}
 }
 throw new Error(last||'Unable to fetch Moxfield deck');
}
function extractDeckNames(deck){
 const boards=deck?.boards||deck;
 const commanderBoard=boards?.commanders||boards?.commander||deck?.commanders;
 const mainBoard=boards?.mainboard||boards?.main||boards?.maindeck||deck?.mainboard;
 const sideBoard=boards?.sideboard||deck?.sideboard;
 const commanders=[],main=[],side=[];
 boardEntries(commanderBoard).forEach(e=>{const n=moxCardName(e);if(n)for(let i=0;i<moxQty(e);i++)commanders.push(n)});
 boardEntries(mainBoard).forEach(e=>{const n=moxCardName(e);if(n)for(let i=0;i<moxQty(e);i++)main.push(n)});
 boardEntries(sideBoard).forEach(e=>{const n=moxCardName(e);if(n)for(let i=0;i<moxQty(e);i++)side.push(n)});
 if(!main.length&&Array.isArray(deck?.cards))deck.cards.forEach(e=>{const n=moxCardName(e);if(n)for(let i=0;i<moxQty(e);i++)main.push(n)});
 return {commanders,main,side};
}
function parseDeckText(text){
 const commanders=[],main=[];let section='main';
 for(const raw of String(text||'').split(/\r?\n/)){
  const line=raw.trim();if(!line||line.startsWith('//'))continue;
  if(/^commander\b/i.test(line)){section='commander';continue}if(/^mainboard\b|^main deck\b/i.test(line)){section='main';continue}if(/^sideboard\b/i.test(line)){section='side';continue}
  const m=line.match(/^(\d+)\s*[xX]?\s+(.+?)(?:\s+\([A-Za-z0-9]+\)\s*\d+.*)?$/);if(!m)continue;
  const qty=Math.max(1,parseInt(m[1],10)),name=m[2].trim();
  if(section==='commander')for(let i=0;i<qty;i++)commanders.push(name);else if(section==='main')for(let i=0;i<qty;i++)main.push(name);
 }
 return {commanders,main};
}
async function fetchCardsForDeck(names){
 const unique=[...new Set(names)],outByName={},out=[];let failed=0;
 for(let i=0;i<unique.length;i+=75){
  const chunk=unique.slice(i,i+75);
  try{
   const r=await fetch('https://api.scryfall.com/cards/collection',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({identifiers:chunk.map(name=>({name}))})});
   if(!r.ok)throw new Error('Scryfall '+r.status);
   const d=await r.json();(d.data||[]).forEach(raw=>{const face=raw.card_faces?.[0];const obj={name:raw.name,type:raw.type_line||'',oracle:raw.oracle_text||face?.oracle_text||'',img:raw.image_uris?.normal||face?.image_uris?.normal||'',colors:raw.colors||face?.colors||[],cmc:raw.cmc||0,manaCost:raw.mana_cost||face?.mana_cost||'',power:raw.power==null?(face?.power==null?null:+face.power):+raw.power,toughness:raw.toughness==null?(face?.toughness==null?null:+face.toughness):+raw.toughness,subtypes:raw.subtypes||face?.subtypes||[],isLand:/^Land\b/i.test(raw.type_line||''),isCreature:/\bCreature\b/i.test(raw.type_line||''),isInstant:/\bInstant\b/i.test(raw.type_line||''),isSorcery:/\bSorcery\b/i.test(raw.type_line||''),hasHaste:/\bhaste\b/i.test((raw.oracle_text||face?.oracle_text||''))||raw.keywords?.some(k=>/^Haste$/i.test(k)),keywords:raw.keywords||[],isCommander:false};outByName[raw.name.toLowerCase()]=obj;cache[raw.name]=obj});
  }catch(e){for(const name of chunk){const c=await card(name);outByName[name.toLowerCase()]=c}}
 }
 for(const name of names){const c=outByName[name.toLowerCase()]||cache[name];if(!c||(!c.img&&!c.type&&!c.oracle))failed++;out.push(c||{name})}return {cards:out,failed};
}
async function loadImportedDeck(lists,title='',fromSetup=false){
 if(!lists.main.length&&!lists.commanders.length)throw new Error('No commander/mainboard cards found.');
 const all=[...lists.commanders,...lists.main],loaded=await fetchCardsForDeck(all),pl=p(1);
 pl.library=[];pl.hand=[];pl.battlefield=[];pl.graveyard=[];pl.exile=[];pl.mana=emptyMana();pl.landPlayed=0;pl.landPlays=1;pl.landPlayBonus=0;pl.commandZone=[];
 loaded.cards.forEach((c,i)=>{if(i<lists.commanders.length)pl.commandZone.push({...c,isCommander:true});else pl.library.push({...c})});
 pl.library.sort(()=>Math.random()-.5);pl.hand=pl.library.splice(0,7);state.openingMulligan=true;state.active=1;state.priority=1;state.phaseIndex=0;state.turn=1;state.stack=[];resetTurnTimer();
 const loading=document.querySelector('#loading');loading.textContent=`Loaded${title?` ${title}`:''}`;setTimeout(()=>loading.style.display='none',1800);
 state.deckTitle=title||'Commander deck';
 log(`Deck imported${title?` — ${title}`:''}. Commander: ${pl.commandZone.length}. Main deck: ${pl.library.length+pl.hand.length}. ${loaded.failed?loaded.failed+' card(s) failed to load from Scryfall.':'Scryfall data loaded.'}`);render();
 if(fromSetup)showOpeningHand();
}
async function importMoxfield(){
 const input=document.querySelector('#moxUrl')?.value||'',id=extractMoxfieldId(input);if(!id){log('Enter a valid public Moxfield deck URL.');return}
 const loading=document.querySelector('#loading');loading.textContent='Loading Moxfield deck…';loading.style.display='block';
 try{const deck=await fetchMoxfieldDeck(id);await loadImportedDeck(extractDeckNames(deck),deck?.name||'Moxfield deck')}catch(e){loading.textContent='Moxfield import failed';setTimeout(()=>loading.style.display='none',2200);log(`Moxfield import failed: ${e.message||e}. Paste the Moxfield export text as fallback.`);render()}
}
async function importDeckText(){
 const text=document.querySelector('#deckText')?.value||'',lists=parseDeckText(text);if(!lists.main.length&&!lists.commanders.length){log('Could not read a decklist. Paste Moxfield export text.');return}
 const loading=document.querySelector('#loading');loading.textContent='Loading decklist…';loading.style.display='block';
 try{await loadImportedDeck(lists,'Imported decklist')}catch(e){loading.textContent='Deck import failed';setTimeout(()=>loading.style.display='none',2200);log(`Deck import failed: ${e.message||e}`);render()}
}
function passTurn(){
 if(state.stack.length){log('The stack must be empty before passing the turn.');return}
 if(state.priority!==state.active){log('Priority must return to the active player before passing the turn.');return}
 // Passing the turn is a real turn transition: skip the rest of the current
 // turn, then choose the next seated player. Empty seats are never selected.
 const from=state.active;
 state.phaseIndex=0;
 state.active=nextSeated(from);
 state.priority=state.active;
 state.turn++;
 resetTurnTimer();
 log(`${p(from).name} passed the turn. Active player: ${p().name}.`);
 startStep();
 render();
}
async function importDeck(fromSetup=false){
 const pl=state.players[0];const loading=document.querySelector('#loading');loading.textContent='Loading Scryfall…';loading.style.display='block';
 pl.library=[];pl.hand=[];
 const results=await Promise.all(sample.map(n=>card(n)));
 const valid=results.filter(c=>c.img||c.type||c.oracle);
 pl.library.push(...results);
 while(pl.library.length<99)pl.library.push({...pl.library[pl.library.length%sample.length]});
 pl.library.sort(()=>Math.random()-.5);pl.hand=pl.library.splice(0,7);pl.commandZone=[{name:'Commander',type:'Legendary Creature',oracle:'',img:'',isCommander:true}];state.openingMulligan=true;
 const failed=results.filter(c=>!c.img).length;loading.textContent=failed?`Scryfall: ${failed} card(s) without image data`:'Scryfall loaded';setTimeout(()=>{loading.style.display='none'},1800);
 state.deckTitle='Sample Commander deck';state.mulligans=0;state.gameStarted=false;state.openingMulligan=true;
 log(`Sample Commander deck imported. 7-card opening hand drawn. ${failed?failed+' card(s) failed to load from Scryfall.':'Scryfall data loaded.'}`);render();if(fromSetup)showOpeningHand();else if(state.turn===1&&state.phaseIndex===0)startStep()
}
function freeMulligan(){if(!state.openingMulligan)return;const pl=p(1);pl.library.push(...pl.hand);pl.hand=[];pl.library.sort(()=>Math.random()-.5);pl.hand=pl.library.splice(0,7);state.openingMulligan=false;log(`${pl.name} took the free mulligan and drew 7.`);render()}
function shuffleLibrary(){p(1).library.sort(()=>Math.random()-.5);log('Library shuffled.');render()}
function playerAction(){if(state.priority===state.active){const now=Date.now();state.timer.turnElapsed=Math.max(0,state.timer.turnElapsed+(state.timer.lastAction?((now-state.timer.lastAction)/1000):0));state.timer.lastAction=now;state.timer.remaining=45}updateTimerUI()}
function resetTurnTimer(){const now=Date.now();state.timer.remaining=45;state.timer.lastAction=now;state.timer.turnElapsed=0;state.timer.startedAt=now;updateTimerUI()}
function updateTimerUI(){const el=document.querySelector('#timer');if(!el)return;el.textContent=`${Math.max(0,state.timer.remaining).toFixed(1)}s`;el.classList.toggle('warn',state.timer.remaining<=10)}
function autoTimeout(){const pl=p();if(!pl||!pl.seated)return;const now=Date.now();state.timer.turnElapsed=Math.max(state.timer.turnElapsed,(now-state.timer.startedAt)/1000);log(`${pl.name} timed out after 45 seconds of inactivity.`);state.timer.remaining=45;state.timer.lastAction=now;if(state.stack.length){state.priority=nextSeated(state.priority);autoPass();render();return}state.priority=state.active;advanceStep(true)}
function startTimerLoop(){if(state.timer.interval)clearInterval(state.timer.interval);state.timer.interval=setInterval(()=>{if(!hasSeat(state.active))return;const now=Date.now();const elapsed=(now-state.timer.lastAction)/1000;state.timer.remaining=Math.max(0,45-elapsed);updateTimerUI();if(state.timer.remaining<=0)autoTimeout()},100)}
function drawCards(pl,n=1){for(let i=0;i<n;i++){if(!pl.library.length){lose(pl,'draw from an empty library');return false}pl.hand.push(pl.library.shift())}return true}
function newGame(){state.players=[1,2,3,4].map(newPlayer);state.active=1;state.phaseIndex=0;state.turn=1;state.stack=[];state.priority=1;state.log=[];state.openingMulligan=true;state.mulligans=0;state.gameStarted=false;state.setupStage='deck';state.deckTitle='';resetTurnTimer();log('Game setup ready. Choose a deck, then keep your opening hand to begin.');render();showSetupDeck()}
newGame();startTimerLoop();
</script></body></html>
