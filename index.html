y:none!important;grid-column:1;grid-row:1;overflow:auto}.bottom{display:none!important}.hand{grid-column:1/3;display:none;align-items:end;justify-content:center;gap:5px;min-height:93px;overflow:hidden}.seat-hand{position:absolute;left:7px;right:7px;bottom:7px;height:74px;display:flex;align-items:flex-end;justify-content:center;gap:4px;max-width:none;overflow:hidden;z-index:1000;pointer-events:auto;border-top:1px solid #294050;padding-top:5px;background:linear-gradient(180deg,transparent,#07111955)}.seat-hand:before{content:"HAND";position:absolute;left:2px;top:-8px;font-size:7px;color:#78919f;letter-spacing:.8px}.seat-hand .card{width:40px;height:56px}.you .seat-hand .card{width:48px;height:67px}.seat-hand .card.legal{outline:2px solid var(--green);cursor:pointer!important}.seat-hand .card[data-card-action="play"]:active{transform:translateY(-8px) scale(1.04);filter:brightness(1.15)}.seat-hand .card{cursor:pointer!important;pointer-events:auto!important;touch-action:none;user-select:none;position:relative;z-index:1002}.hand-card-hit{position:relative;width:40px;height:56px;display:block;flex:0 0 auto;cursor:pointer;pointer-events:auto!important;z-index:1003;touch-action:none}.you .seat-hand .hand-card-hit{width:48px;height:67px}.hand-card-hit .card{display:block;width:100%!important;height:100%!important;pointer-events:none!important}.seat-hand .card.dragging{opacity:.55}.zone{cursor:pointer}.zone:hover{border-color:#6c91a5;background:#10202b;transform:translateY(-2px)}.mana-btn{font-size:8px;padding:3px 5px;margin:2px}.zone-modal{position:fixed;z-index:500;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,90vw);max-height:78vh;overflow:auto;background:#08131bf7;border:1px solid #466173;border-radius:11px;padding:14px;box-shadow:0 20px 80px #000e}.zone-grid{display:flex;flex-wrap:wrap;gap:7px}.zone-grid .card{width:70px;height:98px}.zone-card,.zone-card-back{display:flex;flex-direction:column;align-items:center;gap:4px}.zone-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}.zone-actions button{font-size:9px;padding:4px 6px}.zone-modal h2{margin:0 0 8px}.zone-close{float:right}.zone-note{font-size:10px;color:var(--muted);margin-bottom:10px}.controls{display:none!important;gap:5px;flex-wrap:wrap;align-items:center}.priority{margin-left:auto;color:var(--gold);font-weight:800}.stack-dock{display:none!important;position:absolute;right:8px;bottom:8px;max-width:360px;max-height:120px;overflow:auto;background:#08131bf2;border:1px solid #466173;border-radius:8px;padding:7px;z-index:30}.stack-dock.show{display:block}.stack-dock .stack-title{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}.stack-dock .stackitem{margin:2px 0;padding:4px;font-size:9px}.log{height:130px;overflow:auto;font-size:10px;color:#b7c7d0}.log div{padding:3px 0;border-bottom:1px solid #162630}.reaction{position:absolute;z-index:100;left:50%;top:50%;transform:translate(-50%,-50%);width:min(700px,78%);background:#07121bf5;border:1px solid #577185;border-radius:11px;padding:14px;box-shadow:0 20px 70px #000d} #setupModal{position:fixed;inset:0;z-index:2000} .setup-overlay{position:fixed;inset:0;z-index:1000;background:rgba(2,6,10,.9);display:flex;align-items:center;justify-content:center;padding:20px}.setup-panel{width:min(760px,92vw);max-height:90vh;overflow:auto;background:#09131b;border:1px solid #466173;border-radius:14px;box-shadow:0 25px 100px #000f;padding:22px}.setup-panel h1{margin:0 0 5px;font-size:22px}.setup-panel .sub{margin-bottom:18px}.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.setup-card{background:#0d1b24;border:1px solid #294050;border-radius:10px;padding:14px}.setup-card h3{margin:0 0 8px}.setup-card input,.setup-card textarea{width:100%;padding:9px;background:#071119;color:var(--text);border:1px solid #294050;border-radius:6px}.setup-card textarea{height:110px;resize:vertical}.setup-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.setup-hand{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0 18px}.setup-hand .card{width:88px;height:123px;object-fit:cover;border-radius:6px;box-shadow:0 8px 20px #0008}.setup-hand .card:hover{transform:translateY(-4px) scale(1.03)}.setup-status{font-size:11px;color:var(--muted);min-height:18px}.setup-error{color:var(--red)}.setup-ok{color:var(--green)}.setup-choice{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px}.setup-choice button{min-width:120px}.setup-titlebar{display:flex;justify-content:space-between;align-items:center;gap:10px}.setup-badge{font-size:10px;color:var(--gold);border:1px solid #67582d;border-radius:999px;padding:4px 8px}@media(max-width:800px){.setup-grid{grid-template-columns:1fr}.setup-hand .card{width:75px;height:105px}}.reaction h2{margin:0 0 4px}.sub{font-size:11px;color:var(--muted);margin-bottom:8px}.actions{display:flex;gap:6px;flex-wrap:wrap}.legal{color:var(--green)}.illegal{color:var(--muted)}.timer{font-size:12px;font-weight:900;color:#eaf2f6}.timer.warn{color:#e26d6d}.seat.emptySeat{opacity:.55;background:linear-gradient(145deg,#091118,#050b10)}.seat.emptySeat .battle{align-items:center}.seatToggle{margin:2px;font-size:9px}.phase-ladder{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:18;display:flex;align-items:center;gap:3px;padding:5px 7px;background:rgba(5,10,15,.92);border:1px solid #3b5260;border-radius:999px;box-shadow:0 8px 25px #0009;pointer-events:none}.phase-node{display:flex;align-items:center;gap:3px;color:#738b98;font-size:8px;white-space:nowrap}.phase-node .diamond{width:11px;height:11px;border:1px solid #526b79;transform:rotate(45deg);border-radius:2px;background:#0b151d}.phase-node.active{color:#f2e0a4;font-weight:900}.phase-node.active .diamond{background:var(--gold);border-color:#f1d77e;box-shadow:0 0 8px #d9b65b99}.phase-node.done .diamond{background:#35515e;border-color:#5d7a88}.phase-arrow{color:#526875;font-size:8px}@media(max-w <header class="top"><div class="brand">COMMAND BEACON <span class="pill">rules engine v55</span></div><div class="turnbar"><span id="turn" class="pill">Waiting</span> <span id="step" class="pill">—</span> <span id="timer" class="pill timer">45.0s</span><button id="nextBtn" onclick="advanceStep()" title="Advance the current turn step">Next Step</button><button id="turnBtn" onclick="passTurn()" title="Pass the turn">Pass Turn</button></div></header>
<div class="layout"><main class="board" id="board"><section class="seat" id="seat3"></section><section class="seat" id="seat2"></section><section class="seat you" id="seat1"></section><section class="seat" id="seat4"></section><div id="reaction"></div><div id="phaseLadder" class="phase-ladder"></div></main>
<aside class="side"><b>Deck / Rules</b><div style="margin:8px 0"><button onclick="showSetupDeck()">Choose / restart deck</button><button onclick="shuffleLibrary()">Shuffle</button></div><div style="margin:8px 0"><input id="moxUrl" placeholder="Paste Moxfield deck URL" style="width:100%;padding:7px;background:#08131b;color:#eaf2f6;border:1px solid #294050;border-radius:6px"><button onclick="importMoxfield()" style="margin-top:5px;width:100%">Import from Moxfield URL</button><textarea id="deckText" placeholder="Fallback: paste a Moxfield exported decklist here" style="width:100%;height:70px;margin-top:6px;padding:7px;background:#08131b;color:#eaf2f6;border:1px solid #294050;border-radius:6px;resize:vertical"></textarea><button onclick="importDeckText()" style="margin-top:5px;width:100%">Import decklist text</button><div class="small" style="margin-top:4px">Public Moxfield URLs are supported. Text export is a fallback if the browser blocks the Moxfield request.</div></div><div><b>Seats</b><div id="seatsCtl"></div></div><div id="legalInfo" class="small"></div><hr style="border-color:#1b2b35"><b>Game log</b><div id="log" class="log"></div></aside>

<script>
const sample=["Sol Ring","Command Tower","Arcane Signet","Counterspell","Lightning Bolt","Force of Will","Island","Mountain","Plains","Forest","Swamp","Swords to Plowshares","Brainstorm","Cultivate","Llanowar Elves"];
const cache={};
const phases=["Untap","Upkeep","Draw","Main 1","Beginning of Combat","Declare Attackers","Declare Blockers","First Strike Damage","Combat Damage","End of Combat","Main 2","End Step","Cleanup"];
const COLORS=['W','U','B','R','G','C'];
const state={players:[],active:1,phaseIndex:0,stack:[],priority:1,log:[],turn:1,reaction:null,openingMulligan:true,mulligans:0,gameStarted:false,setupStage:'deck',deckTitle:'',timer:{remaining:45,lastAction:0,maxTurn:300,turnElapsed:0,interval:null}};
function newPlayer(id){return{id,name:`Player ${id}`,seated:true,life:40,hand:[],library:[],battlefield:[],graveyard:[],exile:[],commandZone:[],mana:{W:0,U:0,B:0,R:0,G:0,C:0},landPlays:1,landPlayed:0,landPlayBonus:0,poison:0,experience:0,energy:0,rad:0,monarch:false,initiative:false,cityBlessing:false,commanderDamage:{},commanderCasts:{},attackers:[],blockers:{},blockConfirmed:false,attackTargets:{},damageMarked:0}}
state.players=[1,2,3,4].map(newPlayer);
function seatedPlayers(){return state.players.filter(x=>x.seated)}
function paidMulligans(){return Math.max(0,state.mulligans-1)}
function chooseStartingPlayer(){const ids=seatedPlayers();if(!ids.length)return 1;if(ids.length===1)return ids[0].id;return ids[Math.floor(Math.random()*ids.length)].id}
function nextSeated(fromId){const ids=seatedPlayers().map(x=>x.id);if(!ids.length)return fromId;const i=ids.indexOf(fromId);return ids[(i+1+ids.length)%ids.length]}
function hasSeat(id){return !!state.players[id-1]?.seated}
function setSeat(id,on){if(id===1)return;const pl=state.players[id-1];pl.seated=on;if(!on){pl.attackers=[];pl.blockers={};if(state.active===id){state.active=nextSeated(id);state.priority=state.active;resetTurnTimer()}}log(`${pl.name} ${on?'joined':'left'} the table.`);render()}
function p(id=state.active){return state.players[id-1]}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function log(s){state.log.unshift(s);document.querySelector('#log').innerHTML=state.log.slice(0,30).map(x=>`<div>${esc(x)}</div>`).join('')}
function back(){return 'https://static.wikia.nocookie.net/mtgsalvation_gamepedia/images/f/f8/Magic_card_back.jpg/revision/latest/scale-to-width-down/250?cb=20140813141013'}
function normalizedCard(raw){
 const faces=Array.isArray(raw?.card_faces)&&raw.card_faces.length?raw.card_faces:[raw];
 const front=faces[0]||{};
 const second=faces.length>1?faces[1]:null;
 const display=(second&&second.image_uris)?second:front;
 const landFace=faces.find(f=>/\bLand\b/i.test(f?.type_line||''))||null;
 const play=landFace||front;
 const frontOracle=front.oracle_text||'';
 const displayOracle=display.oracle_text||frontOracle;
 const faceImg=f=>f?.image_uris?.normal||f?.image_uris?.large||f?.image_uris?.small||'';
 const img=faceImg(display)||faceImg(front)||'';
 const artCrop=front?.image_uris?.art_crop||second?.image_uris?.art_crop||'';
 const type=play.type_line||front.type_line||'';
 const isLand=!!landFace || /\bLand\b/i.test(front.type_line||'');
 return {
  name:raw?.name||front.name||'',
  type,
  oracle:isLand?(landFace.oracle_text||''):frontOracle,
  displayOracle,
  img,
  artCrop,
  colors:play.colors||raw?.colors||front.colors||[],
  cmc:raw?.cmc??front.cmc??0,
  manaCost:front.mana_cost||raw?.mana_cost||'',
  power:front.power==null?null:+front.power,
  toughness:front.toughness==null?null:+front.toughness,
  subtypes:play.subtypes||front.subtypes||[],
  isLand,
  isCreature:/\bCreature\b/i.test(type),
  isInstant:/\bInstant\b/i.test(front.type_line||type),
  isSorcery:/\bSorcery\b/i.test(front.type_line||type),
  hasHaste:/\bhaste\b/i.test(frontOracle)||raw?.keywords?.some(k=>/^Haste$/i.test(k))||false,
  keywords:raw?.keywords||front.keywords||[],
  faces,
  frontFace:front,
  backFace:second,
  isCommander:false
 }; 
}

async function card(name){
 if(cache[name])return cache[name];
 const fail={name,type:'',oracle:'',displayOracle:'',img:'',colors:[],cmc:0,manaCost:'',power:null,toughness:null,subtypes:[],isLand:false,isCreature:false,isInstant:false,isSorcery:false,hasHaste:false,keywords:[],faces:[],isCommander:false};
 try{
  const r=await fetch('https://api.scryfall.com/cards/named?exact='+encodeURIComponent(name),{headers:{'Accept':'application/json'}});
  if(!r.ok)throw new Error('Scryfall '+r.status);
  const d=await r.json();
  return cache[name]=normalizedCard(d);
 }catch(e){cache[name]=fail;return fail}
}
function manaAbility(c){const o=c.oracle||'';return /(^|\n).*:\s*.*\badd\b.*(?:mana|\{[WUBRGC]\})/i.test(o)||/\badd\s+(?:\{[WUBRGC]\}|one|two|three|four|five|six|seven|eight|nine|ten)\s+mana\b/i.test(o)}
function hasFlash(c){return c.keywords?.some(k=>k.toLowerCase()==='flash')||/\bflash\b/i.test(c.oracle||'')}
function emptyMana(){return {W:0,U:0,B:0,R:0,G:0,C:0}}
function parseManaCost(cost){const out={W:0,U:0,B:0,R:0,G:0,C:0,generic:0};for(const t of (cost||'').match(/\{[^}]+\}/g)||[]){const x=t.slice(1,-1);if(/^\d+$/.test(x))out.generic+=+x;else if(x in out)out[x]++;else if(x.includes('/')){out.generic++;}else if(/^X$/i.test(x)){}else out.generic++}return out}
function totalMana(m){return COLORS.reduce((a,c)=>a+(m[c]||0),0)}
function canPayPool(pool,cost){const need=parseManaCost(cost);const m={...pool};for(const c of COLORS){const n=need[c]||0;if((m[c]||0)<n)return false;m[c]-=n}let generic=need.generic||0;for(const c of COLORS){const take=Math.min(m[c]||0,generic);m[c]-=take;generic-=take}return generic===0}
function canPay(pl,cost){return canPayPool(pl.mana,cost)}
function canAutoPay(pl,cost){return canPay(pl,cost)||!!findManaSourcesForCost(pl,cost)}
function landManaOptions(c){const o=c.oracle||'';const found=[];const re=/\{([WUBRGC])\}/g;let m;while((m=re.exec(o)))found.push(m[1]);if(!found.length&&/add\s+(?:one|two|three|four|five|six|seven|eight|nine|ten)\s+mana/i.test(o))found.push('C');return [...new Set(found)]}
function canCastWithOneLand(pl,c){if(c.isLand||!pl.hand.includes(c)||!c.manaCost)return false;if(canPay(pl,c.manaCost))return true;const lands=pl.hand.filter(x=>isLandCard(x)&&canLand(pl));return lands.some(land=>{const pool={...pl.mana};landManaOptions(land).forEach(m=>{pool[m]=(pool[m]||0)+1});return canPayPool(pool,c.manaCost)})}
function hasExtraLandfall(pl){return pl.battlefield.some(c=>/landfall/i.test(c.oracle||'')&&/(additional land|play an additional land)/i.test(c.oracle||''))}
function manaPoolAfterSources(pl, choices){
 const pool={...pl.mana};
 choices.forEach(([i,m])=>{pool[m]=(pool[m]||0)+1});
 return pool;
}
function findManaSourcesForCost(pl,cost){
 const sources=pl.battlefield.map((c,i)=>({i,c,opts:landManaOptions(c)}))
   .filter(x=>!x.c.tapped&&x.opts.length&&manaAbility(x.c));
 const need=parseManaCost(cost);
 function satisfies(pool){
   return canPayPool(pool,cost);
 }
 // Try combinations of untapped mana sources. This lets the game automatically
 // tap lands/mana rocks when a spell is cast, like MTG Arena.
 function search(pos, chosen, pool){
   if(satisfies(pool)) return chosen;
   if(pos>=sources.length) return null;
   for(let k=pos;k<sources.length;k++){
     for(const m of sources[k].opts){
       const next={...pool}; next[m]=(next[m]||0)+1;
       const result=search(k+1,[...chosen,[sources[k].i,m]],next);
       if(result)return result;
     }
   }
   return null;
 }
 return search(0,[],{...pl.mana});
}
function autoPayFromManaSources(pl,cost){
 if(canPay(pl,cost))return true;
 const choices=findManaSourcesForCost(pl,cost);
 if(!choices)return false;
 for(const [i,m] of choices){
   const c=pl.battlefield[i];
   if(!c||c.tapped)continue;
   c.tapped=true;
   pl.mana[m]=(pl.mana[m]||0)+1;
 }
 return canPay(pl,cost);
}
function payMana(pl,cost){const need=parseManaCost(cost);for(const c of COLORS){pl.mana[c]-=need[c]||0}let generic=need.generic||0;for(const c of COLORS){const take=Math.min(pl.mana[c],generic);pl.mana[c]-=take;generic-=take}return generic===0}
function manaText(m){return COLORS.filter(c=>m[c]).map(c=>`${c}:${m[c]}`).join(' ')||'—'}
function isLandCard(c){if(!c)return false;const lines=[c.type_line,c.type,c.frontFace?.type_line,c.frontFace?.type,c.backFace?.type_line,c.backFace?.type,...(Array.isArray(c.faces)?c.faces.flatMap(f=>[f?.type_line,f?.type]):[])].filter(Boolean);return c.isLand===true||lines.some(t=>/(^|\s|—)Land(\s|—|$)/i.test(String(t)))}
function canLand(pl){return isMain()&&pl.landPlayed<pl.landPlays}
function isMain(){return state.phaseIndex===3||state.phaseIndex===10}
function canCast(pl,c){if(isLandCard(c)||!pl.hand.includes(c))return false;if(!canPay(pl,c.manaCost))return false;if(isMain())return true;return c.isInstant||hasFlash(c)}
function legalCards(pl){return pl.hand.filter(c=>isLandCard(c)?canLand(pl):canCast(pl,c))}
function cardImg(c){
 const faces=Array.isArray(c?.faces)?c.faces:[];
 if(faces.length>1){
  const f=faces[1];
  const u=f?.image_uris||{};
  return u.normal||u.large||u.small||c?.img||back();
 }
 return c?.img||back();
}
function phaseHint(){

 if(state.phaseIndex===0)return 'Untap: permanents untap automatically. No priority is given during untap.';
 if(state.phaseIndex===1)return 'Upkeep: skipped automatically unless a triggered ability needs to go on the stack.';
 if(state.phaseIndex===2)return 'Draw: draw automatically, then continue to Main 1.';
 if(state.phaseIndex===3||state.phaseIndex===10)return 'Main phase: play a land if you have a land play; cast spells you can legally cast.';
 if(state.phaseIndex===4)return 'Beginning of combat: combat-start triggers may go on the stack.';
 if(state.phaseIndex===5)return 'Declare attackers: choose attackers. Green = legal; red = mandatory requirement.';
 if(state.phaseIndex===6)return 'Declare blockers: defending players choose legal blockers, then confirm.';
 if(state.phaseIndex===7)return 'First-strike damage step. It only occurs when first/double strike matters.';
 if(state.phaseIndex===8)return 'Combat damage step.';
 if(state.phaseIndex===9)return 'End of combat: final combat-only triggers and priority.';
 if(state.phaseIndex===11)return 'End step: end-step triggers go on the stack before cleanup.';
 if(state.phaseIndex===12)return 'Cleanup: discard to maximum hand size, remove marked damage, and end temporary effects.';
 return '';
}

function startStep(){

  processUpkeep(pl);processRad(pl);log(`${pl.name}: upkeep.`);
